version: "3.8"

services:
  trilha:
    image: ivanoliveiraa/quizzberadeiro:latest
    build: .
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.trilha.rule=Host(`trilha.sparkautomacoes.com.br`)"
        - "traefik.http.routers.trilha.entrypoints=web"
        - "traefik.http.services.trilha.loadbalancer.server.port=80"
        # Para HTTPS (se seu Traefik tiver isso):
        # - "traefik.http.routers.trilha.entrypoints=websecure"
        # - "traefik.http.routers.trilha.tls.certresolver=myresolver"
    networks:
      - network_public

networks:
  network_public:
    external: true
