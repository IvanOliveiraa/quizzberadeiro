<!DOCTYPE html>
<html>
  <head>
    <title>Quiz Beradeiro</title>
    <link rel="stylesheet" href="../../css/playerGameView.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Raleway"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="stats">
      <h4 id="nameText">Nome:</h4>
      <h4 id="scoreText">pontuação:</h4>
      <h4 id="rankText"></h4>
    </div>
    <h2 id="message"></h2>
    <!-- Modal de Ranking -->
    <div
      id="rankingModal"
      style="
        display: none;
        position: fixed;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 20px;
        z-index: 1000;
        min-width: 250px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        text-align: center;
      "
    >
      <h3>Ranking</h3>
      <ol id="rankingList" style="text-align: left; margin: 0 auto"></ol>
    </div>
    <button onclick="answerSubmitted(1)" id="answer1" class="button"></button>
    <button onclick="answerSubmitted(2)" id="answer2" class="button"></button>
    <br />
    <button onclick="answerSubmitted(3)" id="answer3" class="button"></button>
    <button onclick="answerSubmitted(4)" id="answer4" class="button"></button>
    <script src="../../socket.io/socket.io.js"></script>
    <script src="../../js/libs/jqueryLibrary.js"></script>
    <script src="../../js/libs/deparam.js"></script>
    <script src="../../js/playerGame.js"></script>
  </body>
</html>
