version: "3.8"

services:
  trilha:
    build: .
    image: trilha:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.trilha.rule=Host(`trilha.sparkautomacoes.com.br`)"
        - "traefik.http.routers.trilha.entrypoints=web"
        - "traefik.http.services.trilha.loadbalancer.server.port=80"
    networks:
      - network_public

networks:
  network_public:
    external: true
